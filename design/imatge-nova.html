<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Afegeix una imatge | Galeria</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="site-header"><nav class="navigation" aria-label="Navegació principal"><a class="brand" href="index.html">Galeria</a><ul><li><a href="index.html">Portada</a></li><li><a href="galeria-admin.html" aria-current="page">Gestiona la galeria</a></li><li><a href="login.html">Canvi d'usuari</a></li><li><a href="about.html">Sobre la web</a></li></ul></nav></header>
  <main class="container"><h1 class="page-heading">Afegeix una imatge</h1><p class="intro">Omple les dades per incorporar una imatge a la galeria.</p>
    <section class="card form-card"><h2>Nova imatge</h2><form action="#" method="post" enctype="multipart/form-data">
      <label for="title">Títol</label><input id="title" name="title" type="text" placeholder="Ex.: Calella" required>
      <label for="description">Descripció</label><textarea id="description" name="description" placeholder="Descriu breument la imatge"></textarea>
      <label for="image">Fitxer d'imatge</label><input id="image" name="image" type="file" accept="image/*" required>
      <label for="alt">Text alternatiu</label><input id="alt" name="alt" type="text" placeholder="Què es veu a la imatge?" required>
      <div class="actions"><button type="submit">Desa la imatge</button><a class="button button-secondary" href="galeria-admin.html">Cancel·la</a></div>
    </form></section>
  </main><footer class="site-footer"><div class="footer-card"><h2>M613 · Desenvolupament web entorn servidor</h2><p>Professor: Dani Prados</p><p>Exemple de galeria amb MVC</p></div></footer>
</body></html>
