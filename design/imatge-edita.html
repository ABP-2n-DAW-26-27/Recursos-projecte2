<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edita una imatge | Galeria</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="site-header"><nav class="navigation" aria-label="Navegació principal"><a class="brand" href="index.html">Galeria</a><ul><li><a href="index.html">Portada</a></li><li><a href="galeria-admin.html" aria-current="page">Gestiona la galeria</a></li><li><a href="login.html">Canvi d'usuari</a></li><li><a href="about.html">Sobre la web</a></li></ul></nav></header>
  <main class="container"><h1 class="page-heading">Edita una imatge</h1><p class="intro">Actualitza les dades de la imatge seleccionada.</p>
    <section class="card form-card"><h2>Calella</h2><form action="#" method="post" enctype="multipart/form-data">
      <label for="title">Títol</label><input id="title" name="title" type="text" value="Calella" required>
      <label for="description">Descripció</label><textarea id="description" name="description">Vista de la costa de Calella.</textarea>
      <label for="image">Canvia el fitxer (opcional)</label><input id="image" name="image" type="file" accept="image/*"><img class="preview-image" src="img/calella.jpg" alt="Imatge actual: Calella">
      <label for="alt">Text alternatiu</label><input id="alt" name="alt" type="text" value="Calella" required>
      <div class="actions"><button type="submit">Desa els canvis</button><a class="button button-secondary" href="galeria-admin.html">Cancel·la</a></div>
    </form></section>
  </main><footer class="site-footer"><div class="footer-card"><h2>M613 · Desenvolupament web entorn servidor</h2><p>Professor: Dani Prados</p><p>Exemple de galeria amb MVC</p></div></footer>
</body></html>
